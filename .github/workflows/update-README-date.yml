name: Update README Copyright Date

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 1 *'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get current date and year
      id: date
      run: |
        echo "CURRENT_YEAR=$(date +'%Y')" >> $GITHUB_ENV
        echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Update README.md placeholders
      run: |
        # Replaces the content between <!-- YEAR --> and <!-- /YEAR -->
        sed -i "s/<!-- YEAR -->.*<!-- \/YEAR -->/<!-- YEAR -->${{ env.CURRENT_YEAR }}<!-- \/YEAR -->/g" README.md
        
        # Replaces the content between <!-- DATE --> and <!-- /DATE -->
        sed -i "s/<!-- DATE -->.*<!-- \/DATE -->/<!-- DATE -->${{ env.CURRENT_DATE }}<!-- \/DATE -->/g" README.md

    - name: Commit and push if changes exist
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated date update" && git push)
